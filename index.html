<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAT GEN — Ultra Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brat-green: #8ace00;
            --bg-deep: #080808;
        }
        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background-color: var(--bg-deep); 
            color: #ffffff;
            overflow-x: hidden;
            margin: 0;
        }

        /* Logo Animation & Floating */
        .logo-container {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: floatLogo 4s ease-in-out infinite;
            transition: all 0.3s ease;
        }
        .logo-container:hover {
            background: rgba(138, 206, 0, 0.1);
            border-color: var(--brat-green);
            transform: scale(1.05);
        }
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Premium Glassmorphism */
        .glass-panel {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        /* Animated Brat Glow */
        .brat-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--brat-green) 0%, rgba(138, 206, 0, 0) 70%);
            filter: blur(100px);
            opacity: 0.15;
            z-index: -1;
            animation: pulse 8s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: translate(-20%, -20%) scale(1); }
            100% { transform: translate(20%, 20%) scale(1.2); }
        }

        /* Input Styling */
        .input-premium {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .input-premium:focus {
            border-color: var(--brat-green);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 20px rgba(138, 206, 0, 0.2);
            outline: none;
        }

        /* Button Master */
        .btn-brat {
            background: var(--brat-green);
            color: #000;
            font-weight: 700;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: -0.05em;
        }
        .btn-brat:hover {
            transform: scale(1.05) rotate(-1deg);
            box-shadow: 0 0 30px rgba(138, 206, 0, 0.4);
        }
        .btn-brat:active { transform: scale(0.95); }

        /* Image Frame */
        .image-frame {
            position: relative;
            background: #111;
            border-radius: 4px;
            padding: 10px;
            transition: all 0.5s ease;
        }

        /* Loading Spinner */
        .loading-shimmer {
            background: linear-gradient(90deg, #111 25%, #222 50%, #111 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <!-- Logo Pojok Kiri Atas -->
    <div class="logo-container">
        <!-- Ganti URL di src="" dengan link logo kamu -->
        <img src="https://i.ibb.co.com/ZRxFFwFY/image.png" alt="Logo" class="w-8 h-8 rounded-full object-cover border border-white/20">
        <span class="text-xs font-bold tracking-[0.2em] text-white/80">REZA.DEV</span>
    </div>

    <div class="brat-glow"></div>
    <div class="brat-glow" style="bottom: -100px; right: -100px; animation-delay: -4s;"></div>

    <!-- Header -->
    <div class="mb-12 text-center">
        <h1 class="text-6xl md:text-8xl font-bold tracking-tighter mb-2 italic">BRAT<span class="text-[var(--brat-green)]">.</span></h1>
        <p class="text-gray-500 uppercase tracking-[0.4em] text-[10px]">Canvas Engine v1.0 Premium</p>
    </div>

    <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-10">
        
        <!-- Sidebar Controls -->
        <div class="glass-panel rounded-[32px] p-8 flex flex-col gap-6">
            <div>
                <label class="text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-3 block">Brat Message</label>
                <textarea id="textInput" placeholder="Type your brat thoughts..." 
                    class="input-premium w-full h-32 p-5 rounded-2xl text-lg resize-none"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-3 block">Background</label>
                    <select id="bgSelect" class="input-premium w-full p-4 rounded-xl text-sm appearance-none cursor-pointer">
                        <option value="White">White (Classic)</option>
                        <option value="Black">Black (Deep)</option>
                        <option value="Lime">Brat Green</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-3 block">Text Color</label>
                    <select id="colorSelect" class="input-premium w-full p-4 rounded-xl text-sm appearance-none cursor-pointer">
                        <option value="Black">Black</option>
                        <option value="White">White</option>
                        <option value="Lime">Brat Green</option>
                    </select>
                </div>
            </div>

            <button id="genBtn" class="btn-brat w-full py-5 rounded-2xl text-xl mt-4">
                Generate Canvas
            </button>
            
            <p class="text-center text-gray-600 text-[10px] font-medium">REZA GENERATED — EVERYTHING IS BRAT</p>
        </div>

        <!-- Preview Area -->
        <div class="flex flex-col items-center justify-center">
            <div id="resultContainer" class="image-frame w-full max-w-[450px] aspect-square rounded-lg shadow-2xl flex items-center justify-center overflow-hidden">
                <div class="text-gray-800 text-sm italic opacity-50 text-center px-6">Your brat aesthetic will manifest here...</div>
            </div>

            <div class="flex gap-4 mt-8 w-full max-w-[450px]">
                <button id="downloadBtn" class="flex-1 py-4 border border-white/10 rounded-xl hover:bg-white/5 transition-all flex items-center justify-center gap-2 text-sm font-bold opacity-50 cursor-not-allowed" disabled>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    DOWNLOAD
                </button>
                <button class="p-4 border border-white/10 rounded-xl hover:bg-white/5 transition-all active:scale-95">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M15 8a3 3 0 10-2.977-2.63l-4.94 2.47a3 3 0 100 4.319l4.94 2.47a3 3 0 10.895-1.789l-4.94-2.47a3.027 3.027 0 000-.74l4.94-2.47C13.456 7.68 14.19 8 15 8z"></path></svg>
                </button>
            </div>
        </div>

    </div>

    <!-- Status Bar -->
    <div class="fixed bottom-6 flex gap-4">
        <div class="glass-panel px-4 py-2 rounded-full border border-white/10 flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-green-500 animate-ping"></div>
            <span class="text-[10px] font-bold tracking-widest text-gray-300">SERVER ACTIVE</span>
        </div>
        <div class="glass-panel px-4 py-2 rounded-full border border-white/10 flex items-center gap-2">
            <span class="text-[10px] font-bold tracking-widest text-gray-300" id="rateLimit">REMAINING: 59</span>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const bgSelect = document.getElementById('bgSelect');
        const colorSelect = document.getElementById('colorSelect');
        const genBtn = document.getElementById('genBtn');
        const resultContainer = document.getElementById('resultContainer');
        const downloadBtn = document.getElementById('downloadBtn');
        const rateLimit = document.getElementById('rateLimit');

        let currentImgUrl = "";

        async function generateBrat() {
            const text = textInput.value.trim() || "Brat";
            const bg = bgSelect.value;
            const color = colorSelect.value;

            genBtn.innerText = "Processing...";
            genBtn.classList.add('opacity-50');
            resultContainer.innerHTML = '<div class="w-full h-full loading-shimmer"></div>';

            try {
                const response = await fetch(`https://api.komputerz.site/api/v1/canvas/brat?apikey=KAPI-27EB5B7C854A89D59B0369BA&text=${encodeURIComponent(text)}&bg=${bg}&color=${color}`);
                const data = await response.json();

                if (data.status && data.result) {
                    currentImgUrl = data.result.image_url;
                    resultContainer.innerHTML = `<img src="${currentImgUrl}" class="w-full h-full object-contain animate-in fade-in zoom-in duration-500 shadow-lg" alt="Brat Output">`;
                    
                    downloadBtn.disabled = false;
                    downloadBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    rateLimit.innerText = `REMAINING: ${data.remaining}`;
                }
            } catch (error) {
                resultContainer.innerHTML = '<div class="text-red-500 text-xs font-bold uppercase tracking-widest">Connection Lost</div>';
            } finally {
                genBtn.innerText = "Generate Canvas";
                genBtn.classList.remove('opacity-50');
            }
        }

        async function downloadImage() {
            if (!currentImgUrl) return;
            try {
                const response = await fetch(currentImgUrl);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `brat-${Date.now()}.png`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                window.open(currentImgUrl, '_blank');
            }
        }

        genBtn.addEventListener('click', generateBrat);
        downloadBtn.addEventListener('click', downloadImage);

        textInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateBrat();
            }
        });
    </script>
</body>
</html>
